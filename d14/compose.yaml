services:
  day14:
    build: .
    ports:
      - "127.0.0.1:${DAY14_PORT:-8081}:8080"
    volumes:
      - day14-data:/app/data
    environment:
      DAY14_WORKER_VALIDATOR_PROVIDER: "${DAY14_WORKER_VALIDATOR_PROVIDER:-openai}"
      DAY14_WORKER_VALIDATOR_MODEL: "${DAY14_WORKER_VALIDATOR_MODEL:-gpt-5.6-terra}"
      DAY14_INSTRUCTION_DETECTOR_PROVIDER: "${DAY14_INSTRUCTION_DETECTOR_PROVIDER:-}"
      DAY14_INSTRUCTION_DETECTOR_MODEL: "${DAY14_INSTRUCTION_DETECTOR_MODEL:-}"
volumes:
  day14-data:
