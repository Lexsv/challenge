services:
  day13:
    build: .
    ports:
      - "127.0.0.1:${DAY13_PORT:-8080}:8080"
    volumes:
      - day13-data:/app/data
    environment:
      DAY13_WORKER_VALIDATOR_PROVIDER: "${DAY13_WORKER_VALIDATOR_PROVIDER:-openai}"
      DAY13_WORKER_VALIDATOR_MODEL: "${DAY13_WORKER_VALIDATOR_MODEL:-gpt-5.6-terra}"
      DAY13_INSTRUCTION_DETECTOR_PROVIDER: "${DAY13_INSTRUCTION_DETECTOR_PROVIDER:-}"
      DAY13_INSTRUCTION_DETECTOR_MODEL: "${DAY13_INSTRUCTION_DETECTOR_MODEL:-}"
volumes:
  day13-data:
