map $uri $opencode_path {
    default "";
    /__d5_opencode_console/models /inference/v1/models;
    /__d5_opencode_console/chat/completions /inference/openai/v1/chat/completions;
    /__d5_opencode_console/responses /inference/openai/v1/responses;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 ipv6=off valid=300s;

    location ~ ^/__d5_opencode_console/(models|chat/completions|responses)$ {
        set $opencode_upstream https://opencode.ai;
        proxy_ssl_server_name on;
        proxy_ssl_name opencode.ai;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;
        proxy_set_header Host opencode.ai;
        proxy_set_header Authorization $http_authorization;
        proxy_pass $opencode_upstream$opencode_path;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
