services:
  day15:
    build: .
    ports:
      - "127.0.0.1:${DAY15_PORT:-8082}:8080"
    volumes:
      - day15-data:/app/data
    environment:
      DAY15_WORKER_VALIDATOR_PROVIDER: "${DAY15_WORKER_VALIDATOR_PROVIDER:-openai}"
      DAY15_WORKER_VALIDATOR_MODEL: "${DAY15_WORKER_VALIDATOR_MODEL:-gpt-5.6-terra}"
      DAY15_INSTRUCTION_DETECTOR_PROVIDER: "${DAY15_INSTRUCTION_DETECTOR_PROVIDER:-}"
      DAY15_INSTRUCTION_DETECTOR_MODEL: "${DAY15_INSTRUCTION_DETECTOR_MODEL:-}"
volumes:
  day15-data:
